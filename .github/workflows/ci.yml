# CI de Route-AI-agent: pruebas (mvn clean verify), imagen de contenedor en GHCR y prueba de la plataforma completa con el
# aislamiento de red (workflow reutilizable de Deployment-Infrastructure, con este servicio en su commit).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: mvn clean verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Los tests de contexto (@SpringBootTest) arrancan Flyway contra PostgreSQL/PostGIS y conectan a Kafka.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: truckcar_db
          POSTGRES_USER: truckcar_admin
          # Base efímera del job: la contraseña cambia en cada ejecución.
          POSTGRES_PASSWORD: ci-${{ github.run_id }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U truckcar_admin -d truckcar_db"
          --health-interval 5s --health-timeout 5s --health-retries 30
      kafka:
        image: apache/kafka:3.8.0
        ports: ["9092:9092"]
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 10s --health-timeout 10s --health-retries 15
    env:
      DB_PASSWORD: ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Pruebas unitarias y de integración
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp clean verify

      - name: Reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  image:
    name: Imagen de contenedor
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Dockerfile común de los servicios Spring (Java 21, usuario sin privilegios).
      - uses: actions/checkout@v4
        with:
          repository: TRUCKCAR-APP/Deployment-Infrastructure
          path: .infra
          sparse-checkout: docker

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: .infra/docker/spring-service.Dockerfile
          push: true
          tags: |
            ghcr.io/truckcar-app/route-ai-agent:main
            ghcr.io/truckcar-app/route-ai-agent:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Amazon ECR (AWS Academy Learner Lab): la misma imagen como truckcar/route-ai-agent:<commit> y :main. Las credenciales
  # temporales del laboratorio son secretos de la organización; sin ellas el job no publica (aviso, sin error).
  ecr:
    name: Imagen en Amazon ECR
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: TRUCKCAR-APP/Deployment-Infrastructure/.github/workflows/ecr-image.yml@main
    with:
      image: route-ai-agent
    secrets: inherit

  platform:
    name: Plataforma
    needs: verify
    uses: TRUCKCAR-APP/Deployment-Infrastructure/.github/workflows/platform.yml@main
    with:
      service-repo: Route-AI-agent
      service-ref: ${{ github.sha }}
    secrets: inherit
