server:
  port: 8086

spring:
  application:
    name: ms-route-ai-agent

  datasource:
    url: jdbc:postgresql://localhost:5432/truckdar_db
    username: truckdar_admin
    password: truckdar_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: route-ai-agent-group
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

truckdar:
  kafka:
    topic:
      route-events: truckdar.events.route-requests
      road-alerts: truckdar.events.road-alerts
      restrictions: truckdar.events.road-restrictions
      route-decisions: truckdar.events.route-plans

app:
  services:
    community-alerts:
      url: http://localhost:8082
    routing-restrictions:
      url: http://localhost:8084

azure:
  openai:
    # Sin valores por defecto: se inyectan solo por variables de entorno (nunca en el repositorio).
    endpoint: ${AZURE_OPENAI_ENDPOINT}
    api-key: ${AZURE_OPENAI_KEY}
    deployment-name: ${AZURE_OPENAI_DEPLOYMENT:gpt-4o-mini}