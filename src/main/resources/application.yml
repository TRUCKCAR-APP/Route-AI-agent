server:
  port: 8086

spring:
  application:
    name: ms-route-ai-agent

  datasource:
    # Fuera de Docker (IDE/tests) la conexión es directa y el esquema va en currentSchema. En Docker se pasa por
    # PgBouncer y el search_path lo fija el rol del servicio.
    url: jdbc:postgresql://localhost:5432/truckcar_db?currentSchema=route_ai_agent,public
    username: ${DB_USER:truckcar_admin}
    # Sin valor por defecto: fuera de Docker se define DB_PASSWORD (en el CI, el de su PostgreSQL efímero).
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # El esquema lo gestiona Flyway (db/migration); Hibernate solo comprueba que coincida con las entidades.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    # Esquema propio del servicio (rol y esquema creados por db-init); el historial de Flyway vive en él.
    schemas: route_ai_agent
    default-schema: route_ai_agent
    # Bases anteriores a Flyway (tablas creadas por Hibernate): línea base 0 para que V1 (idempotente) se aplique.
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: route-ai-agent-group
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

truckcar:
  kafka:
    topic:
      route-events: truckcar.events.route-requests
      road-alerts: truckcar.events.road-alerts
      restrictions: truckcar.events.road-restrictions
      route-decisions: truckcar.events.route-plans
  ai:
    # bedrock | azure | rules (config/AlertInterpreterConfig). azure por defecto: sin endpoint ni clave, reglas.
    provider: ${TRUCKCAR_AI_PROVIDER:azure}
    bedrock:
      # Converse acepta el mismo formato para Nova, Claude o Llama (p. ej. anthropic.claude-3-haiku-20240307-v1:0).
      model-id: ${TRUCKCAR_BEDROCK_MODEL_ID:amazon.nova-micro-v1:0}
      # Credenciales: DefaultCredentialsProvider (LabRole del nodo en AWS Academy, IRSA o Pod Identity en EKS).
      region: ${AWS_REGION:us-east-1}

app:
  services:
    community-alerts:
      url: http://localhost:8082
    routing-restrictions:
      url: http://localhost:8084

azure:
  openai:
    # Solo por variables de entorno (nunca en el repositorio). Sin ellas las alertas se interpretan por reglas.
    endpoint: ${AZURE_OPENAI_ENDPOINT:}
    api-key: ${AZURE_OPENAI_KEY:}
    # gpt-4.1-mini: gpt-4o-mini (2024-07-18) ya no se puede desplegar en Azure (retirado el 31-03-2026). Acepta los
    # mismos parámetros (temperature, max_tokens, respuesta JSON); los modelos de razonamiento (o3, o4, gpt-5) no.
    deployment-name: ${AZURE_OPENAI_DEPLOYMENT:gpt-4.1-mini}

# Llamada al modelo (instancias azureOpenAi y bedrock): Retry -> CircuitBreaker -> TimeLimiter. Si todo falla,
# RuleBasedAlertInterpreter.
resilience4j:
  timelimiter:
    configs:
      aiModel:
        timeout-duration: 4s
        cancel-running-future: true
    instances:
      azureOpenAi:
        base-config: aiModel
      bedrock:
        base-config: aiModel
  circuitbreaker:
    configs:
      aiModel:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 4
        failure-rate-threshold: 50
        slow-call-duration-threshold: 3s
        slow-call-rate-threshold: 80
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      azureOpenAi:
        base-config: aiModel
      bedrock:
        base-config: aiModel
  retry:
    configs:
      aiModel:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
        # 429 o throttling (cuota agotada), 401/403, 400 y 404 no se reintentan: van directo al fallback por reglas.
        retry-exception-predicate: escuelaing.edu.co.truckcar.route_ai_agent.service.TransientModelFailure
        ignore-exceptions:
          # Circuito abierto: no tiene sentido reintentar. Respuesta mal formada: reintentar no la arregla.
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
          - escuelaing.edu.co.truckcar.route_ai_agent.service.ModelAlertInterpreter$InvalidModelResponseException
    instances:
      azureOpenAi:
        base-config: aiModel
      bedrock:
        base-config: aiModel

# ── Observabilidad ──────────────────────────────────────────────────────────────────────────────
# /actuator/prometheus solo es accesible dentro de la red interna: el api-gateway no enruta /actuator/**.
# Las trazas se exportan por OTLP al otel-collector cuando se define MANAGEMENT_OTLP_TRACING_ENDPOINT (en Docker,
# http://otel-collector:4318/v1/traces); sin ella no se exporta nada.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRUCKCAR_TRACING_SAMPLING_PROBABILITY:1.0}
    baggage:
      # X-Correlation-Id (lo genera el api-gateway) viaja como cabecera propia en HTTP y en Kafka y se copia al MDC.
      remote-fields: X-Correlation-Id
      correlation:
        fields: X-Correlation-Id

logging:
  # [servicio,traceId,spanId] en cada línea de log y, en las peticiones que lo traen, el X-Correlation-Id.
  include-application-name: false
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] [cid=%X{X-Correlation-Id:-}] "
